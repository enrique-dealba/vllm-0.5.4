<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-LLM Chat Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .input-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 100;
        }

        #user-input {
            width: 90%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-right: 10px;
        }

        #submit-btn {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .chat-container {
            display: flex;
            justify-content: space-between;
            margin-top: 80px;
            gap: 20px;
        }

        .chat-box {
            flex: 1;
            background: white;
            border-radius: 8px;
            padding: 15px;
            height: 600px;
            overflow-y: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .chat-title {
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            max-width: 80%;
        }

        .user-message {
            background: #007bff;
            color: white;
            margin-left: auto;
        }

        .llm1-message {
            background: #e9ecef;
            color: #212529;
        }

        .llm2-message {
            background: #6c757d;
            color: white;
        }

        .timestamp {
            font-size: 0.8em;
            margin-top: 5px;
        }

        /* Different timestamp colors based on message type */
        .user-message .timestamp {
            color: rgba(255, 255, 255, 0.8);  /* Light color for dark backgrounds */
        }

        .llm1-message .timestamp {
            color: #6c757d;  /* Dark color for light backgrounds */
        }

        .llm2-message .timestamp {
            color: rgba(255, 255, 255, 0.8);  /* Light color for dark backgrounds */
        }

        /* Scrollbar styling */
        .chat-box::-webkit-scrollbar {
            width: 6px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 3px;
        }

        @media (max-width: 768px) {
            .chat-container {
                flex-direction: column;
            }
            
            .chat-box {
                height: 400px;
            }
        }
    </style>

</head>
<body>
    <div class="input-container">
        <input type="text" id="user-input" placeholder="Type your message here...">
        <button id="submit-btn">Send</button>
    </div>

    <div class="chat-container">
        <div class="chat-box" id="chat-llm1">
            <div class="chat-title">User ↔ LLM-1</div>
        </div>

        <div class="chat-box" id="chat-llm1-llm2">
            <div class="chat-title">LLM-1 ↔ LLM-2</div>
        </div>

        <div class="chat-box" id="chat-llm2">
            <div class="chat-title">User ↔ LLM-2</div>
        </div>
    </div>

    <script>
        document.getElementById('submit-btn').addEventListener('click', async function() {
            const input = document.getElementById('user-input');
            const userQuery = input.value.trim();
            
            if (userQuery) {
                const timestamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                // Add user message to both user chat boxes
                const userMessageHTML = `
                    <div class="message user-message">
                        ${userQuery}
                        <div class="timestamp">${timestamp}</div>
                    </div>
                `;
                
                // Add user message to LLM1 ↔ LLM2 conversation
                const userMessageConversationHTML = `
                    <div class="message user-message">
                        ${userQuery}
                        <div class="timestamp">${timestamp}</div>
                    </div>
                `;
                
                // Add messages to appropriate chat boxes
                document.getElementById('chat-llm1').insertAdjacentHTML('beforeend', userMessageHTML);
                document.getElementById('chat-llm1-llm2').insertAdjacentHTML('beforeend', userMessageConversationHTML);
                document.getElementById('chat-llm2').insertAdjacentHTML('beforeend', userMessageHTML);
                
                // Send the user query to the meta endpoint
                try {
                    const response = await fetch('/meta/generate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ text: userQuery })
                    });

                    if (!response.ok) {
                        throw new Error(`Server error: ${response.statusText}`);
                    }

                    const data = await response.json();

                    // Add LLM1 response
                    const llm1ResponseHTML = `
                        <div class="message llm1-message">
                            ${data.llm1_response}
                            <div class="timestamp">${timestamp}</div>
                        </div>
                    `;
                    document.getElementById('chat-llm1').insertAdjacentHTML('beforeend', llm1ResponseHTML);

                    // Add LLM1 ↔ LLM2 conversation
                    const llmConversationHTML = `
                        <div class="message llm1-message">
                            LLM1: ${data.llm1_response}
                            <div class="timestamp">${timestamp}</div>
                        </div>
                        <div class="message llm2-message">
                            LLM2: ${data.llm2_response}
                            <div class="timestamp">${timestamp}</div>
                        </div>
                    `;
                    document.getElementById('chat-llm1-llm2').insertAdjacentHTML('beforeend', llmConversationHTML);

                    // Add LLM2 response
                    const llm2ResponseHTML = `
                        <div class="message llm2-message">
                            ${data.llm2_response}
                            <div class="timestamp">${timestamp}</div>
                        </div>
                    `;
                    document.getElementById('chat-llm2').insertAdjacentHTML('beforeend', llm2ResponseHTML);

                } catch (error) {
                    console.error('Error:', error);
                    alert('An error occurred while processing your request.');
                }
                
                // Clear input and scroll chat boxes
                input.value = '';
                const chatBoxes = document.querySelectorAll('.chat-box');
                chatBoxes.forEach(box => {
                    box.scrollTop = box.scrollHeight;
                });
            }
        });

        // Handle Enter key for submission
        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('submit-btn').click();
            }
        });
    </script>
</body>
</html>
