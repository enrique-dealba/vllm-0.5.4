version: '3.8'
services:
  milvus:
    image: milvusdb/milvus:latest
    container_name: milvus-standalone
    command: milvus run standalone
    ports:
      - "19530:19530"  # Milvus gRPC port
      - "19121:19121"  # Milvus HTTP port
    environment:
      TZ: UTC
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: "/var/lib/milvus/etcd"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-v", "http://localhost:19121/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  app:
    build: .
    container_name: llm
    ports:
      - "8888:8888"
    environment:
      RUN_MODE: ui
      MODEL_TYPE: LLM
      LLM_RESPONSE_SCHEMA: ChunkMetadata
      LANGCHAIN_PROJECT: demo-20241009
      LLM_MODEL_NAME: mistralai/Mistral-Small-Instruct-2409
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY}
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: 19530
    depends_on:
      milvus:
        condition: service_healthy
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface

networks:
  default:
    name: my-network

volumes:
  milvus_data: