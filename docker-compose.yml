version: '3.8'

services:
  milvus:
    image: milvusdb/milvus:latest
    container_name: milvus-standalone
    command: milvus run standalone
    ports:
      - "19530:19530"  # Milvus gRPC port
      - "19121:19121"  # Milvus HTTP port
    environment:
      TZ: UTC
      # Add other environment variables here if needed
    volumes:
      - milvus_data:/var/lib/milvus
      # Uncomment the following lines if you have custom configuration files
      # - ./embedEtcd.yaml:/etc/milvus/embedEtcd.yaml
      # - ./user.yaml:/etc/milvus/user.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19121/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  app:
    build: .
    container_name: llm
    gpus:
      - "all"  # Enables GPU access
    ports:
      - "8888:8888"
    environment:
      RUN_MODE: ui
      MODEL_TYPE: LLM
      LLM_RESPONSE_SCHEMA: ChunkMetadata
      LANGCHAIN_PROJECT: demo-20241009
      LLM_MODEL_NAME: mistralai/Mistral-Small-Instruct-2409
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY}
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: 19530
    depends_on:
      - milvus  # Simple list without conditions
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface

networks:
  default:
    name: my-network

volumes:
  milvus_data:
