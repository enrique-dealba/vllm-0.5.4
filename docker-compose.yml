version: '3.8'

services:
  # Main FastAPI server
  main_server:
    build:
      context: .
      dockerfile: Dockerfile.main
    environment:
      - LLM1_URL=http://llm1:8888/generate
      - LLM2_URL=http://llm2:8888/generate
    ports:
      - "8888:8888"  # Host port 8888 mapped to container port 8888
    volumes:
      - ./frontend/static:/frontend/static
    networks:
      - llm-network

  # Main service for llm1
  llm1:
    image: vllm:cuda11.8
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ['0']  # Only specify device_ids
    environment:
      - PEER_SERVICE_URL=http://llm2:8888
      - SERVICE_ROLE=llm1
      - LLM_MODEL_NAME=${LLM1_MODEL_NAME}
      - MODEL_TYPE=${LLM1_MODEL_TYPE}
      - TEMPERATURE=${LLM1_TEMPERATURE}
      - MAX_TOKENS=${LLM1_MAX_TOKENS}
      - IS_MISTRAL=${LLM1_IS_MISTRAL}
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - SERVICE_NAME=llm1
      - CUDA_DEVICE=0
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=DEBUG
    ports:
      - "8881:8888"  # Host port 8881 mapped to container port 8888
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    networks:
      - llm-network

  # Model pre-loading service for llm1
  llm1_preload:
    image: vllm:cuda11.8
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "source activate vllm && pip install transformers &&
       python -c 'from transformers import AutoModel; AutoModel.from_pretrained(\"mistralai/Mistral-Small-Instruct-2409\", local_files_only=True)'"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ['0']
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    networks:
      - llm-network

  # Main service for llm2
  llm2:
    image: vllm:cuda11.8
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ['1']  # Only specify device_ids
    environment:
      - PEER_SERVICE_URL=http://llm1:8888
      - SERVICE_ROLE=llm2
      - LLM_MODEL_NAME=${LLM2_MODEL_NAME}
      - MODEL_TYPE=${LLM2_MODEL_TYPE}
      - TEMPERATURE=${LLM2_TEMPERATURE}
      - MAX_TOKENS=${LLM2_MAX_TOKENS}
      - IS_MISTRAL=${LLM2_IS_MISTRAL}
      - NVIDIA_VISIBLE_DEVICES=1
      - CUDA_VISIBLE_DEVICES=0
      - SERVICE_NAME=llm2
      - CUDA_DEVICE=0
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=DEBUG
    ports:
      - "8882:8888"  # Host port 8882 mapped to container port 8888
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    networks:
      - llm-network

#  volumes:
#    huggingface_cache:

networks:
  llm-network:
    driver: bridge
