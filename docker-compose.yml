version: '3.8'

services:
  llm1:
    image: vllm:cuda11.8
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ['0']  # Only specify device_ids
    environment:
      - LLM_MODEL_NAME=${LLM1_MODEL_NAME}
      - MODEL_TYPE=${LLM1_MODEL_TYPE}
      - TEMPERATURE=${LLM1_TEMPERATURE}
      - MAX_TOKENS=${LLM1_MAX_TOKENS}
      - IS_MISTRAL=${LLM1_IS_MISTRAL}
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - SERVICE_NAME=llm1
      - CUDA_DEVICE=0
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=DEBUG
    ports:
      - "8881:8888"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    networks:
      - llm-network

  llm2:
    image: vllm:cuda11.8
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              device_ids: ['1']  # Only specify device_ids
    environment:
      - LLM_MODEL_NAME=${LLM2_MODEL_NAME}
      - MODEL_TYPE=${LLM2_MODEL_TYPE}
      - TEMPERATURE=${LLM2_TEMPERATURE}
      - MAX_TOKENS=${LLM2_MAX_TOKENS}
      - IS_MISTRAL=${LLM2_IS_MISTRAL}
      - NVIDIA_VISIBLE_DEVICES=1
      - CUDA_VISIBLE_DEVICES=0
      - SERVICE_NAME=llm2
      - CUDA_DEVICE=0
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=DEBUG
    ports:
      - "8882:8888"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    networks:
      - llm-network

volumes:
  huggingface_cache:

networks:
  llm-network:
    driver: bridge
