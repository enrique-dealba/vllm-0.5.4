version: '3.8'

services:
  timescaledb:
    build:
      context: .
      dockerfile: Dockerfile.timescaledb
    container_name: timescaledb
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - TIMESCALEDB_TELEMETRY=off
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - RUN_MODE=ui
      - MODEL_TYPE=LLM
      - LLM_RESPONSE_SCHEMA=ChunkMetadata
      - LANGCHAIN_PROJECT=demo-20241009
      - LLM_MODEL_NAME=mistralai/Mistral-Small-Instruct-2409
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/local/lib
      - PYTHONPATH=/app
      - TIMESCALE_SERVICE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@timescaledb:5432/${POSTGRES_DB:-postgres}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./app:/app/app
    working_dir: /app
    depends_on:
      timescaledb:
        condition: service_healthy
    ports:
      - "8888:8888"
    networks:
      - app_network

volumes:
  timescaledb_data:
    # Ensure Docker Compose manages the volume
    # Remove 'name' to let Docker Compose handle it internally
    # Alternatively, set 'external: false' explicitly
    # external: false

networks:
  app_network:
    name: app_network