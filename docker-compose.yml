version: '3.8'

services:
  llm1:
    image: vllm:cuda11.8
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
              device_ids: ['0']  # Explicitly use GPU 0
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - SERVICE_NAME=llm1
      - CUDA_DEVICE=0
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=DEBUG
    ports:
      - "8881:8888"
    volumes:
      - huggingface_cache:/root/.cache/huggingface  # Add shared volume for model cache
    networks:
      - llm-network

  llm2:
    image: vllm:cuda11.8
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
              device_ids: ['1']  # Explicitly use GPU 1
    environment:
      - NVIDIA_VISIBLE_DEVICES=1
      - CUDA_VISIBLE_DEVICES=0  # Keep as 0 since it's isolated by NVIDIA_VISIBLE_DEVICES
      - SERVICE_NAME=llm2
      - CUDA_DEVICE=0
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=DEBUG
    ports:
      - "8882:8888"
    volumes:
      - huggingface_cache:/root/.cache/huggingface  # Add shared volume for model cache
    networks:
      - llm-network

volumes:
  huggingface_cache:  # Define shared volume for model cache

networks:
  llm-network:
    driver: bridge
