version: '3.8'
services:
  milvus:
    image: milvusdb/milvus:latest
    container_name: milvus-standalone
    command: milvus run standalone
    ports:
      - "19530:19530"
      - "19121:19121"
    environment:
      - TZ=UTC
    volumes:
      - milvus_data:/var/lib/milvus
    # healthcheck:
    #   test: ["CMD", "nc", "-z", "localhost", "19530"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 20s

  app:
    build: .
    container_name: llm
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8888:8888"
    environment:
      - RUN_MODE=ui
      - MODEL_TYPE=LLM
      - LLM_RESPONSE_SCHEMA=ChunkMetadata
      - LANGCHAIN_PROJECT=demo-20241009
      - LLM_MODEL_NAME=mistralai/Mistral-Small-Instruct-2409
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
    depends_on:
      milvus:
        condition: service_healthy
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface

networks:
  default:
    name: my-network
    
volumes:
  milvus_data:
