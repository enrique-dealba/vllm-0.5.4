<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LLM Chat Interface</title>
    <style>
        #chat-container {
            width: 800px;
            height: 600px;
            margin: 20px auto;
            border: 1px solid #ccc;
            padding: 20px;
        }
        #chat-history {
            height: 500px;
            overflow-y: auto;
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #eee;
        }
        #input-container {
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex-grow: 1;
            padding: 10px;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        .user-message {
            background-color: #e3f2fd;
            margin-left: 20%;
        }
        .bot-message {
            background-color: #f5f5f5;
            margin-right: 20%;
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="chat-history"></div>
        <div id="input-container">
            <input type="text" id="user-input" placeholder="Type your message...">
            <button onclick="sendMessage()">Submit</button>
        </div>
    </div>
    <script src="/static/js/chat.js"></script>
</body>
</html>
