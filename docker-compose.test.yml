version: '3.8'
services:
  test_db:
    image: timescale/timescaledb-ha:pg16
    env_file: .env
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  tests:
    build: 
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - RUN_MODE=test
      - PYTHONPATH=/app
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
      - PYTEST_ADDOPTS="-v --log-cli-level=INFO"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./tests:/app/tests
    depends_on:
      test_db:
        condition: service_healthy