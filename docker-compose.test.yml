version: '3.8'
services:
  test_db:
    image: timescale/timescaledb-ha:pg16
    env_file: .env
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  tests:
    build: .
    env_file: .env
    environment:
      - RUN_MODE=test
      - PYTHONPATH=/app
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./tests:/app/tests
    depends_on:
      test_db:
        condition: service_healthy
    # Add explicit test command
    command: python -m pytest /app/tests -v --log-cli-level=INFO