version: '3.8'
services:
  test_db:
    image: timescale/timescaledb-ha:pg16
    env_file: .env
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  verify:
    build: .
    env_file: .env
    environment:
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/local/lib
      - PYTHONPATH=/app
    entrypoint: []
    command: ["bash", "-c", "source /root/miniconda3/bin/activate vllm && /usr/local/bin/verify_libs.sh"]

  tests:
    build: .
    env_file: .env
    environment:
      - RUN_MODE=test
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/local/lib
      - PYTHONPATH=/app
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./tests:/app/tests
    depends_on:
      test_db:
        condition: service_healthy
    entrypoint: []
    command: ["bash", "-c", "source /root/miniconda3/bin/activate vllm && pytest /app/tests -v --log-cli-level=INFO"]