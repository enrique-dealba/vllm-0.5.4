version: '3.8'
services:
  test_db:
    image: timescale/timescaledb-ha:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - TIMESCALEDB_TELEMETRY=off
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro

  verify:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/local/lib
      - PYTHONPATH=/app
    entrypoint: []
    command: ["/bin/bash", "-c", "source /root/miniconda3/bin/activate vllm && /app/scripts/verify_libs.sh"]

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - RUN_MODE=test
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/local/lib
      - PYTHONPATH=/app
      - TIMESCALE_SERVICE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@test_db:5432/${POSTGRES_DB}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ./tests:/app/tests
    depends_on:
      test_db:
        condition: service_healthy
    entrypoint: []
    command: ["/bin/bash", "-c", "source /root/miniconda3/bin/activate vllm && /app/scripts/verify_env.sh && pytest /app/tests -v --log-cli-level=INFO"]